<!DOCTYPE html>
<html>

<head>
  <title>Settings - Address Finder</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      width: 400px;
    }

    h2 {
      color: #333;
      border-bottom: 2px solid #E63946;
      padding-bottom: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    textarea {
      height: 80px;
      resize: vertical;
    }

    button {
      background-color: #E63946;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      width: 100%;
    }

    button:hover {
      background-color: #D62828;
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: green;
      display: none;
      text-align: center;
    }
  </style>
</head>

<body>
  <h2>Cài đặt kết nối</h2>

  <h3>Lark Base</h3>
  <div class="form-group">
    <label for="larkAppId">App ID</label>
    <input type="text" id="larkAppId" placeholder="cli_...">
  </div>
  <div class="form-group">
    <label for="larkAppSecret">App Secret</label>
    <input type="password" id="larkAppSecret">
  </div>
  <div class="form-group">
    <label for="larkAppToken">App Token (Base/Table Token)</label>
    <input type="text" id="larkAppToken" placeholder="APP_TOKEN from URL">
  </div>
  <div class="form-group">
    <label for="larkTableId">Table ID</label>
    <input type="text" id="larkTableId" placeholder="tbl...">
  </div>

  <h3>Anousith API</h3>
  <div class="form-group">
    <label for="anousithToken">Authorization Token</label>
    <textarea id="anousithToken" placeholder="eyJhbGci..."></textarea>
  </div>



  <button id="saveBtn">Lưu cài đặt</button>
  <div id="status" class="status">Đã lưu thành công!</div>

  <script src="options.js"></script>
</body>

</html>
